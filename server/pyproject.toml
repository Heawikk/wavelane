[project]
name = "wavelane-server"
version = "0.1.0"
description = "Wavelane — music streaming backend with the Wave personalised radio engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "python-multipart>=0.0.17",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "mutagen>=1.47",
    "numpy>=2.1",
    "pillow>=11.0",
    "anyio>=4.6",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]

[project.scripts]
wavelane = "wavelane.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wavelane*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = [
    # FastAPI's whole dependency system is function calls in defaults.
    "B008",
    # Cyrillic text is deliberate: transliteration tables and language tests.
    "RUF001",
    # int(round(x)) guards against numpy scalars reaching a list index.
    "RUF046",
    # Pydantic generics are more predictable with the Generic[T] spelling.
    "UP046",
]

[tool.ruff.lint.per-file-ignores]
# A single stat() on local storage; threading it would cost more than it saves.
"wavelane/api/routers/upload.py" = ["ASYNC240"]
